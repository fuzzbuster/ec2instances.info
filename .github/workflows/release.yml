name: Release

on:
    push:
        tags:
            - "scraper-v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
            - name: Validate tag
              shell: bash
              run: |
                  if [[ ! "$GITHUB_REF_NAME" =~ ^scraper-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Invalid release tag: $GITHUB_REF_NAME" >&2
                      exit 1
                  fi
            - name: Build archives
              shell: bash
              run: |
                  set -euo pipefail
                  version="${GITHUB_REF_NAME#scraper-v}"
                  build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  mkdir -p dist

                  for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
                      os="${target%/*}"
                      arch="${target#*/}"
                      package_dir="build/${os}-${arch}"
                      mkdir -p "$package_dir"

                      CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                          -trimpath \
                          -ldflags "-s -w -X main.version=$version -X main.commit=$GITHUB_SHA -X main.buildDate=$build_date" \
                          -o "$package_dir/ec2instances" .
                      cp LICENSE "$package_dir/LICENSE"
                      tar -C "$package_dir" -czf "dist/ec2instances_${version}_${os}_${arch}.tar.gz" \
                          ec2instances LICENSE
                  done

                  (cd dist && sha256sum ./*.tar.gz > checksums.txt)
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#scraper-v}"
                  gh release create "$GITHUB_REF_NAME" \
                      dist/*.tar.gz dist/checksums.txt \
                      --title "ec2instances $version" \
                      --generate-notes
