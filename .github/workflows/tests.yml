name: Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
            - name: Check formatting
              run: test -z "$(gofmt -l .)"
            - name: Vet
              run: go vet ./...
            - name: Test
              run: go test ./...
            - name: Build
              run: go build ./...
            - name: Validate Agent Skill
              run: |
                  test -f skills/ec2instances/SKILL.md
                  head -20 skills/ec2instances/SKILL.md | grep -q '^name: "ec2instances"$'
                  head -20 skills/ec2instances/SKILL.md | grep -q '^description: ".\\+"$'
